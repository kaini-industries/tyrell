# Dedicated native ARM64 builder. All state lives in ignored build/lima/.
# Deliberately no home/workspace mounts: scripts/builder copies an allowlist.
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
cpus: 4
memory: 4GiB
disk: 64GiB
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2
    arch: aarch64
    digest: sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
portForwards:
  - guestIP: 0.0.0.0
    proto: any
    guestPortRange: [1, 65535]
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential cmake ninja-build dpkg-dev file binutils \
        python3 git curl ca-certificates pkg-config \
        libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libdrm-dev libpulse-dev \
        gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
        gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-x \
        fonts-dejavu-core ffmpeg
      # TYRELL_IMAGE_DEPENDENCIES
probes:
  - mode: readiness
    description: ARM64 Debian package toolchain
    script: |
      #!/bin/sh
      set -eu
      test "$(dpkg --print-architecture)" = arm64
      command -v cmake
      command -v ninja
      command -v c++
      command -v dpkg-deb
      command -v debootstrap
      command -v parted
